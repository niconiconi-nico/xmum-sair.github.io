# 上传表单。字段标题是机器人 intake/intake.py 的解析键（FIELDS / CHECKS），改标题要同时改脚本；见 intake/DESIGN.md
# The upload form. Field labels are the parse keys of intake/intake.py (FIELDS / CHECKS); change both or neither. See intake/DESIGN.md
name: 上传资料 | Upload material
description: 把试卷、大纲、笔记等交给机器人整理，它会开一个 PR 等维护者审核 | Hand papers, syllabi or notes to the bot; it files them and opens a PR for review
title: "[上传 | Upload] "
labels: [upload]
body:
  - type: markdown
    attributes:
      value: |
        感谢分享！只要**选专业、把文件拖进「文件」框、勾选确认**，再点 **Submit new issue**，其余都可以空着。几分钟内机器人会在这个 Issue 下回复一个整理好的 PR 链接，维护者审核合并后网站随即更新。

        机器人借助 AI 做这些事：
        - 逐个分拣：认出每个文件是哪门课、哪个学期、什么类型，按规则改名、放好、登记。多份文件、zip、不同课程和类型混在一起都行。
        - 逐页检查：有没有答案和评分标准，有没有个人信息。
        - PDF 里的学号、姓名、签名等自动涂黑，放进仓库的是涂黑后的副本；Word / PPT 里有个人信息的交给维护者处理。
        - 仓库里已有的同一份文件不重复收；另一套题或新版本自动加后缀。
        - 拿不准的留在 PR 里，交给维护者。

        注意：
        - **拖进来的附件任何人都能下载**，这一点机器人改不了。文件上有你或同学的学号、名字，最好先涂掉再传（手机扫描 App、Acrobat 都能涂）；不方便的话发邮件到 `xieqiyi@ieee.org`。
        - 单个附件最大 **25 MB**；多份文件可以打成一个 zip。更大的文件请拆分，或发邮件。
        - 只收 pdf / docx / pptx / xlsx / doc / ppt / xls / txt / md / csv。**照片请先合成一个 PDF**，单独的图片不收。
        - 规则见 [CONTRIBUTING.md](https://github.com/xmum-sair/xmum-sair.github.io/blob/main/CONTRIBUTING.md) 与 [DISCLAIMER.md](https://github.com/xmum-sair/xmum-sair.github.io/blob/main/DISCLAIMER.md)。
        - 选「匿名」时仓库里不会出现你的名字，但 GitHub 本身仍会显示这个 Issue 和 PR 是谁发的。

        Thanks for sharing! Just **pick your programme, drag your files into the Files box and tick the checklist**, then press **Submit new issue**; everything else can stay empty. Within a few minutes the bot replies here with a link to the pull request it filed, and once a maintainer merges it the website updates.

        What the bot does, with AI:
        - Sorts each file: works out its course, session and type, then renames, files and registers it. Several files, zips, and different courses and types mixed together are all fine.
        - Checks every page for answers, marking schemes and personal data.
        - Blacks out student IDs, names, signatures and the like in PDFs, and commits the blacked-out copy; a Word or PPT file with personal data goes to a maintainer.
        - Skips a file the repo already has; another set or a new version gets a suffix.
        - Leaves anything it is unsure about in the PR for a maintainer.

        Please note:
        - **Anyone can download the attachments you add here**; the bot cannot change that. If a file shows your or a classmate's student ID or name, black it out before uploading (a phone scanner app or Acrobat can do it), or email `xieqiyi@ieee.org` instead.
        - Each attachment is at most **25 MB**; several files can go in one zip. Split bigger files or email us.
        - Accepted: pdf / docx / pptx / xlsx / doc / ppt / xls / txt / md / csv. **Combine photos into one PDF**; images on their own are not accepted.
        - Rules: [CONTRIBUTING.md](https://github.com/xmum-sair/xmum-sair.github.io/blob/main/CONTRIBUTING.md) and [DISCLAIMER.md](https://github.com/xmum-sair/xmum-sair.github.io/blob/main/DISCLAIMER.md).
        - "Anonymous" keeps your name out of the repository files, but GitHub itself still shows who opened this issue and the PR.

  - type: dropdown
    id: prog
    attributes:
      label: "专业 | Programme"
      description: "你自己的专业。代码以 G 或 MPU 开头的全校公共课不管选哪个都放进 GE/ | Your own programme. University-wide courses (codes starting with G or MPU) go to GE/ whichever you pick"
      options:
        - "EEE"
        - "AIT"
        - "ROBO"
    validations:
      required: true

  - type: input
    id: code
    attributes:
      label: "课程代码 | Course code"
      description: "选填，给机器人的提示 | optional, a hint for the bot"
      placeholder: "COM107、EEE212、MPU1.1、G0191"
    validations:
      required: false

  - type: input
    id: name
    attributes:
      label: "课程名称 | Course name"
      description: "选填，给机器人的提示 | optional, a hint for the bot"
      placeholder: "Circuits and Devices"
    validations:
      required: false

  - type: input
    id: session
    attributes:
      label: "学期 | Session"
      description: "选填，给机器人的提示 | optional, a hint for the bot"
      placeholder: "怎么写都行，如 2022-04、2022/4、Apr 2022 | any format, e.g. 2022-04, 2022/4, Apr 2022"
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: "资料类型 | Type"
      description: "选填，给机器人的提示 | optional, a hint for the bot"
      options:
        - "Past-Papers"
        - "Syllabus"
        - "Assignments"
        - "Labs"
        - "Tutorials"
        - "Handbooks"
        - "Notes"
        - "Exam-Review"
        - "Tips"
    validations:
      required: false

  - type: textarea
    id: files
    attributes:
      label: "文件 | Files"
      description: "把文件拖进这个框（或点击框内上传）。可以多份，也可以打成一个 zip；照片请先合成 PDF | Drag the files into this box (or click to upload). Several files or one zip are fine; combine photos into a PDF first"
      placeholder: "拖文件到这里 | Drop files here"
    validations:
      required: true

  - type: input
    id: assessment
    attributes:
      label: "考核名称 | Assessment（试卷用）"
      description: "只在类型是 Past-Papers 时填：Final、Midterm、Test 1、Quiz 2… | Only for Past-Papers: Final, Midterm, Test 1, Quiz 2…"
      placeholder: "Final"

  - type: input
    id: lecturer
    attributes:
      label: "老师 | Lecturer"
      description: "不确定可留空 | Leave blank if unsure"

  - type: input
    id: weighting
    attributes:
      label: "考核比例 | Assessment weighting"
      placeholder: "作业 20%、期中 30%、期末 50% | 20% assignments, 30% midterm, 50% final"

  - type: input
    id: taken
    attributes:
      label: "你修这门课的学期 | Session you took it"
      description: "怎么写都行（2022-04、2022/4、Apr 2022）；留空表示和资料学期相同。用于专业页的「修课时间表」 | Any format (2022-04, 2022/4, Apr 2022); blank means the same as the material's session. Feeds the programme's course timeline"
      placeholder: "2022-04"

  - type: dropdown
    id: credit
    attributes:
      label: "署名方式 | Credit"
      description: "写进课程 README、修课时间表和 CONTRIBUTORS 的名字 | The name written into the course README, the timeline and CONTRIBUTORS"
      options:
        - "用我的 GitHub 用户名 | My GitHub username"
        - "用下面填的昵称 | The nickname below"
        - "匿名 | Anonymous"
    validations:
      required: true

  - type: input
    id: nickname
    attributes:
      label: "昵称 | Nickname"
      description: "选了「用下面填的昵称」才需要填 | Only needed with the nickname option"

  - type: dropdown
    id: intake
    attributes:
      label: "入学年份 | Intake year"
      description: "用于 CONTRIBUTORS 分组，可不选 | Groups you in CONTRIBUTORS; optional"
      options:
        - "2019"
        - "2020"
        - "2021"
        - "2022"
        - "2023"
        - "2024"
        - "2025"
        - "2026"

  - type: textarea
    id: notes
    attributes:
      label: "备注 / 小贴士 | Notes"
      description: "写进课程 README 备注列的一句话，比如 Set B 与 Set A 第 3 题不同 | One line for the course README's notes column, e.g. Set B differs from Set A in Q3"

  - type: checkboxes
    id: checklist
    attributes:
      label: "确认 | Checklist"
      options:
        - label: "没有答案、评分标准、参考解答 | No answers, marking schemes or model solutions"
          required: true
        - label: "我知道附件任何人都能下载，已尽量涂掉学号、姓名、签名、私人联系方式和 Moodle 密钥（进仓库前机器人还会再查一遍） | I know attachments can be downloaded by anyone, and have blacked out student IDs, names, signatures, private contacts and Moodle keys where I could (the bot checks again before anything enters the repo)"
          required: true
        - label: "这门课是我自己修的，或我有权分享这些文件 | I took this course myself, or I have the right to share these files"
          required: true
        - label: "我已读 DISCLAIMER，同意这些文件免费公开、非商业使用 | I have read the DISCLAIMER and agree to these files being public, free and non-commercial"
          required: true
